# Large model configuration - Production grade
# Target: ~12M parameters
# Designed for Colab T4 GPU training (16GB VRAM) with gradient accumulation
# Parameter breakdown:
# - Embedding: 30*128 + 10*128 + 512*128 ≈ 75K
# - 12x Transformer blocks: 12 * ~450K ≈ 5.4M
# - Prediction heads: ~200K
# - Total: ~12M parameters

model:
  hidden_dim: 128
  num_layers: 12
  num_heads: 4
  ffn_dim: 256
  dropout: 0.1
  use_rmsnorm: true

training:
  epochs: 20
  learning_rate: 5e-5
  weight_decay: 0.01
  batch_size: 16
  warmup_steps: 200
  patience: 10
  gradient_clipping: 1.0

data:
  context_length: 512
  horizons:
    - 1
    - 3
    - 6
    - 12
    - 48
    - 144
    - 288
    - 2016