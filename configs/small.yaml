# Small model configuration - M0 target
# Approx 2-3M parameters
model:
  hidden_dim: 128
  num_layers: 4
  num_heads: 4
  ffn_dim: 256

training:
  epochs: 10
  learning_rate: 1e-4
  weight_decay: 0.01
  batch_size: 32
  warmup_steps: 100
  patience: 5

data:
  context_length: 512
  horizons:
    - 1
    - 3
    - 6
    - 12
    - 48
    - 144
    - 288
    - 2016