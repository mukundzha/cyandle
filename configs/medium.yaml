# Medium model configuration - M0 target
# Target: ~5M parameters
# Designed for Colab T4 GPU training (16GB VRAM)
# Parameter breakdown:
# - Embedding: 30*128 + 10*128 + 512*128 ≈ 75K
# - 8x Transformer blocks (6 layers + final norm): 8 * ~350K ≈ 2.8M
# - Prediction heads: ~200K
# - Additional embedding layers: ~200K
# - Total: ~5M parameters

model:
  hidden_dim: 128
  num_layers: 6
  num_heads: 4
  ffn_dim: 256
  dropout: 0.1
  use_rmsnorm: true

training:
  epochs: 10
  learning_rate: 1e-4
  weight_decay: 0.01
  batch_size: 32
  warmup_steps: 100
  patience: 5
  gradient_clipping: 1.0

data:
  context_length: 512
  horizons:
    - 1
    - 3
    - 6
    - 12
    - 48
    - 144
    - 288
    - 2016